name: Terraform 19c create and destroy

# Manual only. The environment approval must be configured in GitHub settings.
on:
  workflow_dispatch:
    inputs:
      network_mode:
        description: Create new networks or use existing networks (keep unchanged for cleanup)
        required: true
        type: choice
        options: [create, existing]
        default: create
      client_cidr:
        description: New application subnet IPv4 CIDR (create mode; keep unchanged for cleanup)
        type: string
        default: '10.30.0.0/24'
      database_cidr:
        description: New ODB client subnet IPv4 CIDR (create mode; keep unchanged for cleanup)
        type: string
        default: '10.31.0.0/24'
      existing_vpc_id:
        description: Existing VPC full resource ID (existing mode only)
        type: string
      existing_application_subnet_id:
        description: Existing application subnet full resource ID for the new VM
        type: string
      existing_odb_network_id:
        description: Existing ODB network full resource ID
        type: string
      existing_odb_subnet_id:
        description: Existing Client ODB subnet full resource ID
        type: string
      database_version:
        description: Database version for this deployment (keep unchanged for cleanup)
        required: true
        type: choice
        options: ['19c', '26ai']
        default: '19c'
      operation:
        description: Create/update, disable deletion protection, or destroy the 19c example
        required: true
        type: choice
        options: [deploy, prepare-destroy, destroy]
        default: deploy
      cleanup_scope:
        description: Cleanup scope; keep the same choice for prepare-destroy and destroy
        required: true
        type: choice
        options: [all, database-only, client-only, odb-network-and-database]
        default: all
      confirmation:
        description: For prepare-destroy or destroy, type adbs-19c
        required: false
        type: string
      contact_email:
        description: Notification email for the separate 19c example
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: adbs-19c-example
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: 'false'
  STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: terraform-plan
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: terraform
        shell: bash
    outputs:
      plan_sha256: ${{ steps.plan.outputs.sha256 }}
    env:
      TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
      TF_VAR_contact_email: ${{ inputs.contact_email }}
      TF_VAR_admin_password: ${{ secrets.ADB19C_ADMIN_PASSWORD }}
      NETWORK_MODE: ${{ inputs.network_mode }}
      CLIENT_CIDR: ${{ inputs.client_cidr }}
      DATABASE_CIDR: ${{ inputs.database_cidr }}
      EXISTING_VPC: ${{ inputs.existing_vpc_id }}
      EXISTING_APP_SUBNET: ${{ inputs.existing_application_subnet_id }}
      EXISTING_ODB_NETWORK: ${{ inputs.existing_odb_network_id }}
      EXISTING_ODB_SUBNET: ${{ inputs.existing_odb_subnet_id }}
      SELECTED_DATABASE_VERSION: ${{ inputs.database_version }}
      REQUESTED_OPERATION: ${{ inputs.operation }}
      CLEANUP_SCOPE: ${{ inputs.cleanup_scope }}
      CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - name: Check out the selected commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false
      - name: Check non-secret workflow identity claims
        run: |
          python3 - <<'PY'
          import os, json, base64, urllib.request
          request = urllib.request.Request(os.environ['ACTIONS_ID_TOKEN_REQUEST_URL'] + '&audience=identity-diagnostics', headers={'Authorization': 'Bearer ' + os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']})
          token = json.load(urllib.request.urlopen(request))['value']
          claims = json.loads(base64.urlsafe_b64decode(token.split('.')[1] + '=='))
          for key in ['sub', 'ref', 'repository_id', 'repository_owner_id']:
              print(key + ': ' + str(claims.get(key)))
          PY
      - name: Authenticate through Workload Identity Federation
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.TF_SERVICE_ACCOUNT }}
      - name: Install Google Cloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Check required configuration
        run: |
          test -n "$STATE_BUCKET"
          test -n "$TF_VAR_project_id"
          test -n "$TF_VAR_admin_password"
          test -n "$TF_VAR_contact_email"
          case "$NETWORK_MODE" in
            create) python3 ../scripts/check-network-inputs.py "$CLIENT_CIDR" "$DATABASE_CIDR" ;;
            existing)
              test -n "$EXISTING_VPC"
              test -n "$EXISTING_APP_SUBNET"
              test -n "$EXISTING_ODB_NETWORK"
              test -n "$EXISTING_ODB_SUBNET"
              ;;
            *) exit 1 ;;
          esac
          case "$CLEANUP_SCOPE" in
            all|database-only|client-only) ;;
            odb-network-and-database)
              test "$NETWORK_MODE" = create || { echo 'Reused ODB networks cannot be deleted by this deployment'; exit 1; }
              ;;
            *) exit 1 ;;
          esac
          case "$SELECTED_DATABASE_VERSION" in
            19c|26ai) ;;
            *) echo 'Unsupported database version'; exit 1 ;;
          esac
          case "$REQUESTED_OPERATION" in
            deploy) ;;
            prepare-destroy|destroy) test "$CONFIRMATION" = "adbs-19c" ;;
            *) exit 1 ;;
          esac
          # These project-wide APIs are prerequisites, not owned by this example state.
          for api in compute.googleapis.com oracledatabase.googleapis.com iap.googleapis.com; do
            gcloud services list --enabled --project="$TF_VAR_project_id" --format="value(config.name)" | grep -Fx "$api" > /dev/null
          done
      - name: Initialize shared state and validate
        run: |
          terraform fmt -check
          terraform init -input=false -lockfile=readonly -backend-config="bucket=$STATE_BUCKET" -backend-config="prefix=adbs/19c-example"
          terraform validate
      - name: Create and display the plan
        id: plan
        run: |
          # Explicit CLI input overrides the sample file's version assignment.
          args=(-var-file=environments/19c.tfvars "-var=database_version=$SELECTED_DATABASE_VERSION")
          args+=("-var=network_mode=$NETWORK_MODE" "-var=existing_vpc_id=$EXISTING_VPC" "-var=existing_application_subnet_id=$EXISTING_APP_SUBNET" "-var=existing_odb_network_id=$EXISTING_ODB_NETWORK" "-var=existing_odb_subnet_id=$EXISTING_ODB_SUBNET")
          if [ "$NETWORK_MODE" = create ]; then
            args+=("-var=client_cidr=$CLIENT_CIDR" "-var=database_cidr=$DATABASE_CIDR")
          fi
          case "$REQUESTED_OPERATION" in
            deploy) ;;
            prepare-destroy) args+=(-var=deletion_protection=false) ;;
            destroy)
              args+=(-var=deletion_protection=false)
              case "$CLEANUP_SCOPE" in
                all) args+=(-destroy) ;;
                database-only) args+=(-var=retain_database=false) ;;
                client-only) args+=(-var=retain_client=false) ;;
                odb-network-and-database) args+=(-var=retain_database=false -var=retain_odb_network=false) ;;
              esac
              ;;

          esac
          terraform plan -input=false -lock-timeout=5m "${args[@]}" -out=deployment.tfplan
          if [ "$REQUESTED_OPERATION" = destroy ] && [ "$CLEANUP_SCOPE" != all ]; then
            terraform show -json deployment.tfplan > cleanup-plan.json
            python3 ../scripts/check-cleanup-plan.py "$CLEANUP_SCOPE" cleanup-plan.json
            rm -f cleanup-plan.json
          fi
          terraform show -no-color deployment.tfplan
          echo "sha256=$(sha256sum deployment.tfplan | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          echo 'Review the Terraform plan in this job before approving terraform-apply.' >> "$GITHUB_STEP_SUMMARY"
      - name: Store the saved plan privately
        # Binary plans can contain secrets. Never upload them as public-repo artifacts.
        run: |
          gcloud storage cp deployment.tfplan "gs://$STATE_BUCKET/private-plans/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT/deployment.tfplan" --if-generation-match=0

  apply:
    needs: plan
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # GitHub pauses here for the configured required reviewer.
    environment: terraform-apply
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: terraform
        shell: bash
    env:
      EXPECTED_PLAN_SHA256: ${{ needs.plan.outputs.plan_sha256 }}
    steps:
      - name: Check out the same commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false
      - name: Authenticate through Workload Identity Federation
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.TF_SERVICE_ACCOUNT }}
      - name: Install Google Cloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Download and verify the reviewed plan
        run: |
          gcloud storage cp "gs://$STATE_BUCKET/private-plans/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT/deployment.tfplan" deployment.tfplan
          echo "$EXPECTED_PLAN_SHA256  deployment.tfplan" | sha256sum --check
      - name: Apply the saved plan
        run: |
          terraform init -input=false -lockfile=readonly -backend-config="bucket=$STATE_BUCKET" -backend-config="prefix=adbs/19c-example"
          terraform apply -input=false -lock-timeout=5m deployment.tfplan
      - name: Remove the temporary private plan
        if: always()
        run: |
          rm -f deployment.tfplan
          gcloud storage rm "gs://$STATE_BUCKET/private-plans/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT/deployment.tfplan"
